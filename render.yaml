services:
  - type: web
    name: carry
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@10.34.5 install --frozen-lockfile --prod=false && npx --yes pnpm@10.34.5 build
    startCommand: node apps/api/src/server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: CARRY_SERVE_WEB
        value: "1"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CARRY_OPENROUTER_FREE_KEY
        sync: false
